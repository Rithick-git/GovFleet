version: '3.8'

# ==============================================================================
# GovFleet Real-Time Bus Tracking Infrastructure
# Stack: Mosquitto (MQTT), Kafka (KRaft), Redis, MongoDB, Kafka-UI
# Optimized for WSL2 (Ubuntu / Debian) & Local Development
# ==============================================================================

networks:
  govfleet-net:
    driver: bridge
    name: govfleet-net

volumes:
  mosquitto_data:
    name: govfleet_mosquitto_data
  mosquitto_log:
    name: govfleet_mosquitto_log
  kafka_data:
    name: govfleet_kafka_data
  redis_data:
    name: govfleet_redis_data
  mongo_data:
    name: govfleet_mongo_data

services:
  # ----------------------------------------------------------------------------
  # 1. Eclipse Mosquitto (IoT MQTT Broker)
  # Ingestion layer for vehicle GPS hardware / simulator
  # ----------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: govfleet-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883" # Standard MQTT
      - "9001:9001" # WebSockets MQTT
    volumes:
      - ./docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - govfleet-net
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 nc -z 127.0.0.1 1883 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Apache Kafka (KRaft Mode - No ZooKeeper required)
  # High-throughput event streaming spine
  # ----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: govfleet-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"   # Host access (Node.js/Python on host or WSL)
      - "29092:29092" # Internal docker network access
    networks:
      - govfleet-net
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: '4L622nShTZaJguQTRbmc0A'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824 # 1 GB
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Kafka UI (Observability & Stream Inspector)
  # Web dashboard to monitor Kafka topics, consumers, offsets, and messages
  # ----------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: govfleet-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080" # Accessible at http://localhost:8085
    networks:
      - govfleet-net
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: govfleet-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ----------------------------------------------------------------------------
  # 4. Redis (In-Memory Real-Time State & Geospatial Cache)
  # Stores active vehicle locations, geohashes, and fast retrieval queries
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: govfleet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - govfleet-net
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 5. MongoDB (Historical Fleet Telemetry & Route Storage)
  # Document store for route geometries, trip archives, and audit logs
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: govfleet-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - govfleet-net
    environment:
      MONGO_INITDB_DATABASE: govfleet
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
