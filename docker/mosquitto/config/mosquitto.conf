# Mosquitto MQTT Broker Configuration
# GovFleet Real-Time Fleet Telemetry Platform

# Plain MQTT Listener
listener 1883 0.0.0.0

# WebSocket Listener (Optional, for direct browser MQTT connections)
listener 9001 0.0.0.0
protocol websockets

# Allow unauthenticated connections for local development/simulation
allow_anonymous true

# Persistence configuration
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection rate and buffer limits for high-throughput IoT devices
max_connections 10000
max_queued_messages 50000
